services:
  # -------------------------------------------------------------
  # 1. MySQL Database Service
  # -------------------------------------------------------------
  mysql:
    image: mysql:5.7.44
    container_name: mysql57
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: asg_db
      MYSQL_USER: attech
      MYSQL_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - gateway_network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # -------------------------------------------------------------
  # 2. Control Position Component Service (gateway-cp)
  # -------------------------------------------------------------
  gateway-cp:
    build:
      context: ./
      dockerfile: ./gateway-cp/Dockerfile
    container_name: asg-gateway-cp
    pid: "host"
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8180:8180"
    environment:
      - SERVER_PORT=8180
      - DB_URL=jdbc:mysql://mysql57:3306/asg_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8
      - DB_USER=root
      - DB_PASS=123456
      - LOG_LEVEL_ASG=INFO
    networks:
      - gateway_network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8180/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # -------------------------------------------------------------
  # 3. SWIM Component Service (gateway-swim)
  # -------------------------------------------------------------
  gateway-swim:
    build:
      context: ./
      dockerfile: ./gateway-swim/Dockerfile
    container_name: asg-gateway-swim
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8181:8181"
    environment:
      - SERVER_PORT=8181
      - DB_URL=jdbc:mysql://mysql57:3306/asg_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8
      - DB_USER=root
      - DB_PASS=123456
      - AMQP_HOST=host.docker.internal
      - AMQP_PORT=5672
      - AMQP_USER=admin
      - AMQP_PASS=admin
      - RETENTION_DAYS=30
      - LOG_LEVEL_ASG=DEBUG
    networks:
      - gateway_network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

# -------------------------------------------------------------
# VOLUMES
# -------------------------------------------------------------
volumes:
  mysql_data:
    external: true
    name: amhs-swim-gateway_mysql_data
# -------------------------------------------------------------
# NETWORKS
# -------------------------------------------------------------
networks:
  gateway_network:
    driver: bridge