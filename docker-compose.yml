version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Database Service (MySQL)
  # -------------------------------------------------------------
  mysql-db:
    image: mysql:8.0
    container_name: asg-mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "asg_db"
      TZ: "UTC"
    ports:
      - "3306:3306"
    volumes:
      # Persistent volume for MySQL database storage
      - mysql_data:/var/lib/mysql
      # Automatically import database schema and seed data on initial creation
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asg-network

  # -------------------------------------------------------------
  # 2. Control Position Component Service (gateway-cp)
  # -------------------------------------------------------------
  gateway-cp:
    build:
      context: ./gateway-cp
      dockerfile: Dockerfile.jar
    container_name: asg-gateway-cp
    restart: always
    ports:
      - "8180:8180"  # Map to internal dynamic port 8180 from DB config SERVER_PORT_CP
    environment:
      - SERVER_PORT=8180
      - DB_URL=jdbc:mysql://mysql-db:3306/asg_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
      - DB_USER=root
      - DB_PASS=123456
      - LOG_LEVEL_ASG=INFO
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - asg-network

  # -------------------------------------------------------------
  # 3. SWIM Component Service (gateway-swim)
  # -------------------------------------------------------------
  gateway-swim:
    build:
      context: ./gateway-swim
      dockerfile: Dockerfile.jar
    container_name: asg-gateway-swim
    restart: always
    ports:
      - "8181:8181"  # Map to internal dynamic port 8181 from DB config SERVER_PORT_SWIM
    environment:
      - SERVER_PORT=8181
      - DB_URL=jdbc:mysql://mysql-db:3306/asg_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
      - DB_USER=root
      - DB_PASS=123456
      - AMQP_HOST=127.0.0.1      # Connects to solace-broker-primary active database configuration
      - AMQP_PORT=5672
      - AMQP_USER=admin
      - AMQP_PASS=admin
      - LOG_LEVEL_ASG=DEBUG
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - asg-network

# -------------------------------------------------------------
# Networks & Volumes definitions
# -------------------------------------------------------------
networks:
  asg-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
